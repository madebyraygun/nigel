name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/madebyraygun/nigel/blob/main/.github/cla/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],*[bot]'
          custom-notsigned-prcomment: >-
            Thanks for the contribution! Before we can merge, we ask every external
            contributor to sign the Nigel CLA (linked below) — a one-time comment on
            this PR. Your work stays yours and stays MIT-licensed here; the agreement
            lets us also ship it in Nigel's signed builds and commercial licensing.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          lock-pullrequest-aftermerge: false
