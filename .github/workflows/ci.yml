name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:

  no-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for real book data
        run: ./scripts/check-no-real-data.sh

  # Decides whether anything outside backlog/, docs/, .claude/ and *.md
  # changed. The heavy job skips at the job level rather than through a
  # workflow-level paths-ignore, because a skipped job satisfies a required
  # branch-protection check while a never-triggered workflow leaves it
  # "expected" forever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect non-docs changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # No usable base (new branch, force push): run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -vE '^(backlog/|docs/|\.claude/)|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The web UI is built before any cargo step so rust-embed bakes in the
      # freshly built SPA rather than the placeholder build.rs seeds.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Test web
        working-directory: web
        run: npm test

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test -- --test-threads=1

      - name: Run tests (no default features)
        run: cargo test --no-default-features -- --test-threads=1

      - name: Run tests (serve only)
        run: cargo test --no-default-features --features serve -- --test-threads=1

      - name: Run tests (nigel-core alone)
        run: cargo test -p nigel-core -- --test-threads=1

      - name: Install the desktop shell's Linux system libraries
        timeout-minutes: 10
        # Only Linux needs them: the shell renders through WebKitGTK there,
        # while macOS uses the system WKWebView with nothing to install.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build and test the desktop shell
        # Its own workspace, so the root build never unifies nigel-core's
        # desktop feature into the nigel binary. That keeps it out of every
        # command above, which is why it gets its own.
        working-directory: crates/nigel-desktop
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test -- --test-threads=1
