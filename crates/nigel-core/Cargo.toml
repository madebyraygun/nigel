[package]
name = "nigel-core"
version = "1.0.1"
edition = "2021"
description = "Cash-basis bookkeeping core: data layer, importers, rules, reports, invoicing and the web server"

[features]
default = ["gusto", "pdf", "serve"]
gusto = ["dep:calamine"]
pdf = ["dep:printpdf"]
serve = ["dep:axum", "dep:tokio", "dep:tower", "dep:rust-embed", "dep:open", "dep:subtle"]
# The router a desktop shell serves over its custom URI scheme, with no
# session guard. Not in `default`: it must never reach the `nigel serve`
# binary, which is the only thing `default` builds.
desktop = ["serve"]
# Test scaffolding — seeded databases, a router with a session, and the guard
# that redirects `~/.config/nigel` — compiled for dependents' test targets only.
# The config-directory override is `#[cfg(test)]` inside this crate, and a
# dependent's tests are not this crate's tests: without the feature their
# `TempConfigDir` would compile away and they would read and rewrite the
# developer's real settings.json.
testutil = ["dep:tempfile"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
csv = "1"
calamine = { version = "0.25", optional = true }
regex = "1"
comfy-table = { version = "7", default-features = false }
colored = "2"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
printpdf = { version = "0.7", optional = true, features = ["embedded_images"] }
base64 = "0.22"
thiserror = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
rusty-s3 = "0.5"
semver = "1"
zeroize = "1.8.2"
axum = { version = "0.8.9", optional = true, default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
tokio = { version = "1.53", optional = true, features = ["rt-multi-thread", "net", "signal", "sync", "macros", "time"] }
tower = { version = "0.5", optional = true, features = ["util"] }
rust-embed = { version = "8.12", optional = true, features = ["debug-embed", "mime-guess"] }
open = { version = "5.4", optional = true }
subtle = { version = "2.6", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
